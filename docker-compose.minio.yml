# This project's own MinIO for manual screenshots. Independent of RAGFlow.
#   docker compose -f docker-compose.minio.yml up -d
# Console: http://<host>:9101   API: http://<host>:9000
services:
  minio:
    image: minio/minio
    container_name: koili-minio
    command: server /data --console-address ":9101"
    ports:
      - "9000:9000"
      - "9101:9101"
    environment:
      MINIO_ROOT_USER: koili
      MINIO_ROOT_PASSWORD: koili123
    volumes:
      - ./minio_data:/data
    restart: unless-stopped
